services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      # The image installs production dependencies only, so the container
      # runs in production mode. Use `npm run dev` on the host for
      # development, where dev tooling is available.
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://cache:6379
      STORAGE_DIR: /app/storage
      LOG_LEVEL: info
    volumes:
      # Processed files survive a container restart.
      - storage:/app/storage
    depends_on:
      cache:
        condition: service_healthy
    restart: unless-stopped

  # The worker runs the same image as the API but a different command.
  # Separate processes on purpose: a worker busy resizing an image must
  # never make an HTTP request wait, and the queue is scaled by adding
  # workers, not API instances.
  worker:
    build: .
    command: ["node", "dist/jobs/worker.js"]
    environment:
      NODE_ENV: production
      REDIS_URL: redis://cache:6379
      STORAGE_DIR: /app/storage
      LOG_LEVEL: info
    volumes:
      # The worker reads what the API wrote, so they share the volume.
      - storage:/app/storage
    depends_on:
      cache:
        condition: service_healthy
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # A healthcheck so `depends_on` can wait for Redis to actually answer,
    # not merely for its container to exist.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  storage:
